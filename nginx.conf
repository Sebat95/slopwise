events {
    worker_connections 1024;
}

http {
    include mime.types;

    # Long cache for hashed static assets, no-cache for HTML routes
    map $uri $cache_control {
        ~*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp)$  "public, max-age=31536000, immutable";
        default                                                         "no-cache, no-store, must-revalidate";
    }

    server {
        listen 8080;
        server_name _;

        # gzip compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;

            add_header Cache-Control $cache_control;

            add_header X-Frame-Options "SAMEORIGIN";
            add_header X-Content-Type-Options "nosniff";
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' https://accounts.google.com https://www.gstatic.com; img-src 'self' blob: data: https://lh3.googleusercontent.com; font-src 'self' https://www.gstatic.com; connect-src 'self' https://oauth2.googleapis.com https://www.googleapis.com https://sheets.googleapis.com; frame-src https://accounts.google.com; worker-src 'self' blob:;";
        }
    }
}