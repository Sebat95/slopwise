substitutions:
  _REGION: europe-west1
  _SERVICE: slopwise
  _IMAGE: europe-west1-docker.pkg.dev/slopwise-auth-1bb0d/cloud-run-source-deploy/slopwise/slopwise

availableSecrets:
  secretManager:
    - versionName: projects/468513744130/secrets/VITE_FIREBASE_CONFIG/versions/latest
      env: VITE_FIREBASE_CONFIG
    - versionName: projects/468513744130/secrets/GOOGLE_CLIENT_ID/versions/latest
      env: GOOGLE_CLIENT_ID

steps:
  # Unit + e2e tests before image build; failures stop the pipeline.
  - id: test
    name: mcr.microsoft.com/playwright:v1.58.2-jammy
    entrypoint: bash
    env:
      - CI=true
    args:
      - -c
      - |
        set -euo pipefail
        npm install -g corepack@latest
        corepack enable
        corepack prepare yarn@4.12.0 --activate
        export VITE_GOOGLE_CLIENT_ID="$$GOOGLE_CLIENT_ID"
        yarn install --immutable
        yarn test
    secretEnv:
      - VITE_FIREBASE_CONFIG
      - GOOGLE_CLIENT_ID
    timeout: 1200s

  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker build --pull \
          --build-arg "VITE_FIREBASE_CONFIG=$$VITE_FIREBASE_CONFIG" \
          --build-arg "VITE_GOOGLE_CLIENT_ID=$$GOOGLE_CLIENT_ID" \
          -t "${_IMAGE}:$SHORT_SHA" \
          -t "${_IMAGE}:latest" \
          .
    secretEnv:
      - VITE_FIREBASE_CONFIG
      - GOOGLE_CLIENT_ID

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}:$SHORT_SHA

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=256Mi
      - --min-instances=0
      - --max-instances=2
      - --set-env-vars=NODE_ENV=production
      - --update-secrets=GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,TOKEN_ENCRYPTION_KEY=TOKEN_ENCRYPTION_KEY:latest
      - --quiet

images:
  - ${_IMAGE}:$SHORT_SHA
  - ${_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
